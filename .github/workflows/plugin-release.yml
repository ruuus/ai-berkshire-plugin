name: Release Codex plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve locked upstream commit
        id: upstream
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          sha = json.loads(
              Path("UPSTREAM.lock.json").read_text(encoding="utf-8")
          )["sourceCommit"]
          if re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit("UPSTREAM.lock.json contains an invalid sourceCommit")
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a", encoding="utf-8"
          ) as output:
              print(f"sha={sha}", file=output)
      - name: Check out locked upstream source
        uses: actions/checkout@v4
        with:
          repository: xbtlin/ai-berkshire
          ref: ${{ steps.upstream.outputs.sha }}
          path: .upstream/ai-berkshire
          fetch-depth: 1
          persist-credentials: false
      - name: Validate plugin
        run: |
          python3 plugin-packaging/sync_from_upstream.py --check --source-dir .upstream/ai-berkshire
          python3 plugin-packaging/validate.py
      - name: Build offline release assets
        run: |
          python3 plugin-packaging/build_release.py \
            --output-dir dist \
            --expected-version "${GITHUB_REF_NAME}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/ai-berkshire-plugin-${GITHUB_REF_NAME}.zip" \
            "dist/ai-berkshire-plugin-${GITHUB_REF_NAME}.tar.gz" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --latest \
            --title "AI Berkshire Codex Plugin ${GITHUB_REF_NAME}" \
            --notes "Codex marketplace release ${GITHUB_REF_NAME}. Download ZIP or tar.gz together with SHA256SUMS, verify the archive, extract it, and follow the bundled README.md for offline installation."
