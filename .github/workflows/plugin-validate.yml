name: Validate Codex plugin

on:
  push:
    branches:
      - codex-plugin
    paths:
      - ".agents/plugins/**"
      - "plugin-packaging/**"
      - "plugins/ai-berkshire/**"
      - "UPSTREAM.lock.json"
      - "codex-skills/**"
      - "tools/**"
      - ".github/workflows/plugin-validate.yml"
  pull_request:
    paths:
      - ".agents/plugins/**"
      - "plugin-packaging/**"
      - "plugins/ai-berkshire/**"
      - "UPSTREAM.lock.json"
      - "codex-skills/**"
      - "tools/**"
      - ".github/workflows/plugin-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/sync-codex-skills.py --check
      - run: python3 plugin-packaging/sync_from_upstream.py --check --upstream-ref origin/main
      - run: python3 plugin-packaging/validate.py
